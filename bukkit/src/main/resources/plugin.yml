name: MiniGames
version: '${project.version}'
main: com.mcmiddleearth.minigames.MiniGames
description: old Plugin with Bungee
author: Jubo, Eriol_Eandur
api-version: 1.18

permissions:
  minigames.*:
    description: Gives access to all miniGames commands
    default: op
  minigames.staff:
    description: Gives access to /game delete command
    default: op
  minigames.manager:
    description: Gives guides access to minigames commands for managing games
    default: op
  minigames.user:
    description: Gives access miniGames commands for players
    default: op